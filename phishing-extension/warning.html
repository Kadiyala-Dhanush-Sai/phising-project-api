<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>⚠️ Phishing Warning</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #1a1a1a;
            border: 1px solid #ff4444;
            border-radius: 16px;
            padding: 40px;
            max-width: 540px;
            width: 90%;
            text-align: center;
        }

        .icon {
            font-size: 56px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 24px;
            color: #ff4444;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #aaa;
            font-size: 15px;
            margin-bottom: 24px;
        }

        .url-box {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 13px;
            color: #ff8888;
            word-break: break-all;
            margin-bottom: 12px;
            text-align: left;
        }

        .score {
            font-size: 13px;
            color: #888;
            margin-bottom: 28px;
        }

        .score span {
            color: #ff4444;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-safe {
            background: #1d6f3a;
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            flex: 1;
        }

        .btn-safe:hover {
            background: #27923f;
        }

        .btn-back {
            background: transparent;
            color: #aaa;
            border: 1px solid #444;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            flex: 1;
        }

        .btn-back:hover {
            background: #222;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">🚨</div>
        <h1>Phishing Site Detected</h1>
        <p class="subtitle">This URL has been flagged as a potential phishing site.</p>
        <div class="url-box" id="blocked-url">Loading...</div>
        <div class="score">Risk score: <span id="risk-score">—</span></div>
        <div class="buttons">
            <button class="btn-back" onclick="history.back()">← Go Back (Safe)</button>
            <button class="btn-safe" onclick="proceedAnyway()">Proceed Anyway</button>
        </div>
    </div>
    <script src="warning.js"></script>
</body>

</html>
